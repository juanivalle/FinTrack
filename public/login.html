<!DOCTYPE html>
<html class="dark" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>FinTrack - Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display min-h-screen flex flex-col overflow-x-hidden">
    <!-- Navbar -->
    <header
        class="flex items-center justify-between whitespace-nowrap border-b border-solid border-slate-200 dark:border-[#283039] px-6 md:px-10 py-3 bg-white dark:bg-[#111418]">
        <div class="flex items-center gap-4 text-slate-900 dark:text-white">
            <div class="size-8 text-primary">
                <span class="material-symbols-outlined text-3xl">finance_mode</span>
            </div>
            <h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] cursor-pointer"
                onclick="window.location.href='/'">FinTrack</h2>
        </div>
        <button onclick="window.location.href='register.html'"
            class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-primary text-white text-sm font-bold leading-normal tracking-[0.015em] transition hover:bg-primary/90">
            <span class="truncate">Registrarse</span>
        </button>
    </header>
    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center justify-center p-4 sm:px-40 py-10 relative">
        <!-- Abstract Background -->
        <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
            <div class="absolute top-0 left-1/4 w-96 h-96 bg-primary/10 rounded-full blur-[128px]"></div>
            <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-purple-500/10 rounded-full blur-[128px]"></div>
        </div>
        <div
            class="layout-content-container flex flex-col max-w-[480px] w-full z-10 bg-white dark:bg-[#1c2127] rounded-xl border border-slate-200 dark:border-[#283039] shadow-xl p-8">
            <!-- Page Heading -->
            <div class="flex flex-col gap-3 mb-8 text-center">
                <p class="text-slate-900 dark:text-white text-3xl font-black leading-tight tracking-[-0.033em]">Iniciar
                    Sesión</p>
                <p class="text-slate-500 dark:text-[#9dabb9] text-base font-normal leading-normal">Accede a tu panel
                    financiero en tiempo real.</p>
            </div>
            <!-- Login Form -->
            <form id="login-form" class="flex flex-col gap-5 w-full">
                <!-- Email Field -->
                <div class="flex flex-col gap-2">
                    <label class="text-slate-900 dark:text-white text-sm font-medium leading-normal">Correo
                        electrónico</label>
                    <input id="email" required autocomplete="username"
                        class="form-input flex w-full min-w-0 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white border border-slate-300 dark:border-[#3b4754] bg-slate-50 dark:bg-[#111418] focus:border-primary focus:ring-1 focus:ring-primary h-12 px-4 placeholder:text-slate-400 dark:placeholder:text-[#9dabb9] text-base font-normal leading-normal transition-colors"
                        placeholder="ej. demo@example.com" type="email" value="" />
                </div>
                <!-- Password Field -->
                <div class="flex flex-col gap-2">
                    <div class="flex justify-between items-center">
                        <label
                            class="text-slate-900 dark:text-white text-sm font-medium leading-normal">Contraseña</label>
                        <a class="text-primary text-sm font-medium hover:underline" href="#">¿Olvidaste tu
                            contraseña?</a>
                    </div>
                    <div class="flex w-full items-stretch rounded-lg relative">
                        <input id="password" required autocomplete="current-password"
                            class="form-input flex w-full min-w-0 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white border border-slate-300 dark:border-[#3b4754] bg-slate-50 dark:bg-[#111418] focus:border-primary focus:ring-1 focus:ring-primary h-12 pl-4 pr-12 text-base font-normal leading-normal transition-colors"
                            placeholder="Ingresa tu contraseña" type="password" value="" />
                        <button
                            class="absolute right-0 top-0 bottom-0 px-3 flex items-center justify-center text-slate-400 dark:text-[#9dabb9] hover:text-slate-600 dark:hover:text-white transition-colors"
                            type="button" onclick="togglePassword()">
                            <span class="material-symbols-outlined text-[20px]">visibility</span>
                        </button>
                    </div>
                </div>
                <div id="error-msg" class="text-red-500 text-sm hidden">Credenciales inválidas</div>
                <!-- Login Button -->
                <button
                    class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-4 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 transition shadow-lg shadow-primary/20 mt-2"
                    type="submit">
                    <span class="truncate">Iniciar Sesión</span>
                </button>
            </form>
            <!-- Divider -->
            <div class="relative my-8">
                <div aria-hidden="true" class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-slate-200 dark:border-[#283039]"></div>
                </div>
                <div class="relative flex justify-center">
                    <span class="bg-white dark:bg-[#1c2127] px-2 text-sm text-slate-500 dark:text-[#9dabb9]">O continúa
                        con</span>
                </div>
            </div>
            <!-- Social Login Buttons -->
            <div class="grid grid-cols-2 gap-4">
                <button
                    class="flex items-center justify-center gap-3 h-11 px-4 rounded-lg border border-slate-300 dark:border-[#3b4754] bg-white dark:bg-[#111418] hover:bg-slate-50 dark:hover:bg-[#283039] text-slate-900 dark:text-white text-sm font-medium transition-colors">
                    <!-- Google Icon placeholder since no image data allowed, using SVG -->
                    <svg class="h-5 w-5" viewbox="0 0 24 24">
                        <path
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                            fill="#4285F4"></path>
                        <path
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                            fill="#34A853"></path>
                        <path
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                            fill="#FBBC05"></path>
                        <path
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                            fill="#EA4335"></path>
                    </svg>
                    <span class="truncate">Google</span>
                </button>
                <button
                    class="flex items-center justify-center gap-3 h-11 px-4 rounded-lg border border-slate-300 dark:border-[#3b4754] bg-white dark:bg-[#111418] hover:bg-slate-50 dark:hover:bg-[#283039] text-slate-900 dark:text-white text-sm font-medium transition-colors">
                    <svg class="h-5 w-5 fill-current" viewbox="0 0 24 24">
                        <path
                            d="M17.05 20.28c-.98.95-2.05.88-3.08.4-.68-.32-1.42-.48-2.25-.48-.92 0-1.74.19-2.52.54-.92.42-1.92.47-2.77-.4-2.88-2.94-2.39-8.47 2.5-8.73 1.35-.07 2.37.56 3.08.56.63 0 1.83-.6 3.26-.51 2.22.15 3.39 1.19 3.42 1.22-.05.04-2.03 1.18-2.04 3.53.01 2.81 2.5 3.75 2.55 3.77-.03.11-.38 1.34-1.26 2.62-.77 1.13-1.58 2.26-2.59 2.24l.05-.04zM12.03 7.25c-.15-2.23 1.66-4.08 3.74-4.25.18 2.45-2.12 4.41-3.74 4.25z">
                        </path>
                    </svg>
                    <span class="truncate">Apple</span>
                </button>
            </div>
            <!-- Footer Sign Up -->
            <div class="mt-8 text-center">
                <p class="text-slate-500 dark:text-[#9dabb9] text-sm">
                    ¿No tienes una cuenta?
                    <a class="text-primary font-bold hover:underline ml-1" href="register.html">Regístrate</a>
                </p>
            </div>
        </div>
    </main>
    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errDiv = document.getElementById('error-msg');
            errDiv.classList.add('hidden');

            try {
                const res = await fetch('http://localhost:3000/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('access_token', data.accessToken);
                    window.location.href = 'dashboard.html';
                } else {
                    errDiv.textContent = 'Credenciales incorrectas. Intenta de nuevo.';
                    errDiv.classList.remove('hidden');
                }
            } catch (error) {
                console.error(error);
                errDiv.textContent = 'Error de conexión.';
                errDiv.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
