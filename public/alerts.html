<!DOCTYPE html>
<html class="dark" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Mis Alertas - FinTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-dark": "#0b0e11",
                        "surface-dark": "#1c2127",
                        "border-dark": "#283039",
                        "bull": "#0bda5b",
                        "bear": "#fa6238",
                    },
                    fontFamily: { "display": ["Inter", "sans-serif"] },
                },
            },
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #3b4754;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #5a6b7c;
        }
    </style>
</head>

<body class="bg-background-dark text-white font-display overflow-hidden h-screen flex flex-col">

    <!-- Header -->
    <header class="h-16 border-b border-border-dark bg-[#111418] flex items-center justify-between px-6 shrink-0 z-20">
        <div class="flex items-center gap-2 text-primary cursor-pointer" onclick="window.location.href='index.html'">
            <span class="material-symbols-outlined text-3xl">query_stats</span>
            <span class="text-xl font-bold tracking-tight text-white">FinTrack</span>
        </div>

        <div class="flex items-center gap-4">
            <button onclick="logout()"
                class="flex items-center gap-2 text-sm font-medium text-[#9dabb9] hover:text-white transition-colors">
                <span class="material-symbols-outlined">logout</span>
                <span class="hidden sm:inline">Salir</span>
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar Navigation -->
        <aside class="w-64 border-r border-border-dark bg-[#111418] flex flex-col shrink-0 hidden md:flex">
            <div class="flex-1 overflow-y-auto py-6 px-3 flex flex-col gap-1">
                <a href="dashboard.html"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#9dabb9] hover:bg-[#283039] hover:text-white transition-colors">
                    <span class="material-symbols-outlined">dashboard</span>
                    <span>Dashboard</span>
                </a>
                <a href="comparison.html"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#9dabb9] hover:bg-[#283039] hover:text-white transition-colors">
                    <span class="material-symbols-outlined">compare_arrows</span>
                    <span>Comparar</span>
                </a>
                <a href="alerts.html"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-primary/10 text-primary font-medium">
                    <span class="material-symbols-outlined">notifications</span>
                    <span>Alertas</span>
                </a>
                <a href="community.html"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#9dabb9] hover:bg-[#283039] hover:text-white transition-colors">
                    <span class="material-symbols-outlined">forum</span>
                    <span>Comunidad</span>
                </a>
                <a href="settings.html"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#9dabb9] hover:bg-[#283039] hover:text-white transition-colors">
                    <span class="material-symbols-outlined">settings</span>
                    <span>Configuración</span>
                </a>
            </div>

            <div class="p-4 border-t border-border-dark">
                <div class="flex items-center gap-3">
                    <div id="user-avatar"
                        class="size-8 rounded-full bg-surface-dark flex items-center justify-center text-primary font-bold">
                        U</div>
                    <div class="flex flex-col">
                        <span id="user-name" class="text-xs font-bold text-white">Cargando...</span>
                        <span id="user-plan" class="text-[10px] text-[#9dabb9]">...</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0 bg-[#0b0e11] overflow-hidden relative pb-16 md:pb-0">
            <div class="p-6 flex flex-col gap-6 h-full overflow-y-auto">

                <div class="flex justify-between items-end">
                    <div>
                        <h1 class="text-2xl font-bold text-white">Mis Alertas</h1>
                        <p class="text-[#9dabb9] text-sm">Gestiona tus notificaciones de precios.</p>
                    </div>
                    <button onclick="window.location.href='asset-detail.html'"
                        class="flex items-center gap-2 bg-primary hover:bg-blue-600 text-white px-4 py-2 rounded-lg font-bold transition-colors">
                        <span class="material-symbols-outlined text-[20px]">add_alert</span>
                        Nueva Alerta
                    </button>
                </div>

                <!-- Alerts Table -->
                <div class="border border-border-dark rounded-xl bg-[#111418] overflow-hidden w-full">
                    <table class="w-full text-left">
                        <thead class="bg-[#1c2127] text-xs uppercase text-[#9dabb9]">
                            <tr>
                                <th class="p-4">Activo</th>
                                <th class="p-4">Condición</th>
                                <th class="p-4 hidden md:table-cell">Creada</th>
                                <th class="p-4 text-right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-border-dark text-sm" id="alerts-body">
                            <!-- Rows injected via JS -->
                            <tr>
                                <td colspan="4" class="p-8 text-center text-[#9dabb9]">Cargando alertas...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </main>
        <!-- Mobile Bottom Navigation -->

    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 flex flex-col gap-3 z-50"></div>

    <script>
        const API_URL = ''; // Relative path
        const token = localStorage.getItem('access_token');

        // --- TOAST NOTIFICATIONS ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            // Colors
            let bg = 'bg-[#1c2127]';
            let border = 'border-border-dark';
            let icon = 'info';
            let iconColor = 'text-[#9dabb9]';

            if (type === 'success') {
                bg = 'bg-[#0f2e1b]'; // Dark green tint
                border = 'border-bull/30';
                icon = 'check_circle';
                iconColor = 'text-bull';
            } else if (type === 'error') {
                bg = 'bg-[#2e1212]'; // Dark red tint
                border = 'border-bear/30';
                icon = 'error';
                iconColor = 'text-bear';
            }

            toast.className = `flex items-center gap-3 px-4 py-3 rounded-lg border ${border} ${bg} text-white shadow-xl transform transition-all duration-300 translate-y-2 opacity-0 min-w-[300px]`;
            toast.innerHTML = `
                <span class="material-symbols-outlined ${iconColor}">${icon}</span>
                <span class="text-sm font-medium flex-1">${message}</span>
                <button onclick="this.parentElement.remove()" class="text-[#9dabb9] hover:text-white">
                    <span class="material-symbols-outlined text-sm">close</span>
                </button>
            `;

            container.appendChild(toast);

            // Animate
            requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));

            // Dismiss
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        }

        if (!token) window.location.href = 'login.html';

        function logout() {
            localStorage.removeItem('access_token');
            window.location.href = 'login.html';
        }

        async function loadProfile() {
            try {
                const res = await fetch(`${API_URL}/auth/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error('Failed to load profile');
                const user = await res.json();

                // Update Sidebar
                const userName = user.name || user.email.split('@')[0];
                document.getElementById('user-name').innerText = userName;
                document.getElementById('user-plan').innerText = user.plan === 'FREE' ? 'Plan Gratuito' : 'Premium';

                // Update Avatar
                const initial = userName[0].toUpperCase();
                const avatarEl = document.getElementById('user-avatar');

                if (user.avatarUrl) {
                    avatarEl.innerText = '';
                    avatarEl.style.backgroundImage = `url('${API_URL}${user.avatarUrl}')`;
                    avatarEl.style.backgroundSize = 'cover';
                    avatarEl.style.backgroundPosition = 'center';
                    avatarEl.classList.remove('text-primary');
                } else {
                    avatarEl.innerText = initial;
                    avatarEl.style.backgroundImage = 'none';
                    avatarEl.classList.add('text-primary');
                }
            } catch (error) {
                console.error('Profile Load Error:', error);
                document.getElementById('user-name').innerText = 'Usuario';
            }
        }

        async function loadAlerts() {
            console.log("Loading alerts...");
            try {
                const res = await fetch('/alerts', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    const alerts = await res.json();
                    renderAlerts(alerts);
                } else {
                    console.error("Failed to load alerts, status:", res.status);
                    document.getElementById('alerts-body').innerHTML = '<tr><td colspan="4" class="p-8 text-center text-red-500">Error al cargar alertas.</td></tr>';
                }
            } catch (e) {
                console.error("Network error loading alerts:", e);
                showToast("Error de conexión descargando alertas", "error");
            }
        }

        function renderAlerts(alerts) {
            const tbody = document.getElementById('alerts-body');
            tbody.innerHTML = '';

            if (!alerts || alerts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-[#9dabb9]">No tienes alertas activas. <a href="asset-detail.html" class="text-primary hover:underline">Crear una.</a></td></tr>';
                return;
            }

            alerts.forEach(alert => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-[#1c2127] transition-colors";

                const conditionText = alert.condition === 'PRICE_ABOVE'
                    ? `<span class="text-bull flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">trending_up</span> Sube de $${alert.value}</span>`
                    : `<span class="text-bear flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">trending_down</span> Baja de $${alert.value}</span>`;

                tr.innerHTML = `
                    <td class="p-4 font-bold text-white">${alert.symbol}</td>
                    <td class="p-4">${conditionText}</td>
                    <td class="p-4 text-[#9dabb9] hidden md:table-cell">${new Date(alert.createdAt).toLocaleDateString()}</td>
                    <td class="p-4 text-right">
                        <button onclick="requestDelete('${alert.id}')" class="text-[#9dabb9] hover:text-bear p-2 rounded hover:bg-white/5 transition-colors" title="Eliminar">
                            <span class="material-symbols-outlined">delete</span>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function requestDelete(id) {
            // Optional: Confirm with custom modal? For now just proceed or Use a toast Undo pattern.
            // Since user complained about browser alerts, we will just do it, or make a custom simple confirm?
            // "Menos es más" for now, let's just delete and show success toast.

            try {
                const res = await fetch(`/alerts/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    showToast("Alerta eliminada correctamente", "success");
                    loadAlerts();
                } else {
                    const err = await res.json();
                    showToast(err.message || "Error al eliminar alerta", "error");
                }
            } catch (e) {
                console.error("Error catch delete:", e);
                showToast("Error de red", "error");
            }
        }

        // Init
        loadProfile();
        loadAlerts();

    </script>
</body>

</html>
