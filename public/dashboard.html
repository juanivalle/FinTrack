<!DOCTYPE html>
<html class="dark" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>FinTrack - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-dark": "#111418",
                        "surface-dark": "#1c2127",
                        "border-dark": "#283039",
                        "bull": "#0bda5b",
                        "bear": "#fa6238",
                    },
                    fontFamily: { "display": ["Inter", "sans-serif"] },
                },
            },
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #3b4754;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #5a6b7c;
        }

        @keyframes marquee {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        .animate-marquee {
            animation: marquee 30s linear infinite;
        }

        .animate-marquee:hover {
            animation-play-state: paused;
        }
    </style>
</head>

<body class="bg-background-dark text-white font-display overflow-hidden h-screen flex flex-col">

    <!-- Header -->
    <header
        class="h-16 border-b border-border-dark bg-[#111418] flex items-center justify-between px-4 md:px-6 shrink-0 z-20">
        <div class="flex items-center gap-2 text-primary cursor-pointer" onclick="window.location.href='index.html'">
            <span class="material-symbols-outlined text-2xl md:text-3xl">query_stats</span>
            <span class="text-lg md:text-xl font-bold tracking-tight text-white">FinTrack</span>
        </div>

        <div class="flex items-center gap-4">
            <div class="hidden md:flex items-center bg-[#1c2127] rounded-lg border border-border-dark px-3 py-1.5 w-64">
                <span class="material-symbols-outlined text-[#9dabb9] text-sm">search</span>
                <input type="text" id="search-input" placeholder="Buscar activo (BTC, AAPL)..."
                    class="bg-transparent border-none focus:ring-0 text-sm w-full text-white placeholder-[#9dabb9]">
            </div>
            <button onclick="logout()"
                class="flex items-center gap-2 text-sm font-medium text-[#9dabb9] hover:text-white transition-colors">
                <span class="material-symbols-outlined">logout</span>
                <span class="hidden sm:inline">Salir</span>
            </button>
        </div>
    </header>

    <!-- Ticker -->
    <div class="bg-[#0b0e11] border-b border-border-dark h-8 flex items-center overflow-hidden shrink-0">
        <div class="animate-marquee whitespace-nowrap flex items-center gap-8 text-xs font-medium px-4">
            <div class="flex gap-2 items-center"><span class="text-[#9dabb9]">BTC/USD</span> <span class="text-white"
                    id="ticker-btc">--</span> <span class="text-bull">+2.15%</span></div>
            <div class="flex gap-2 items-center"><span class="text-[#9dabb9]">ETH/USD</span> <span class="text-white"
                    id="ticker-eth">--</span> <span class="text-bull">+1.85%</span></div>
            <div class="flex gap-2 items-center"><span class="text-[#9dabb9]">SPY</span> <span class="text-white"
                    id="ticker-spy">--</span> <span class="text-bull">+0.54%</span></div>
            <div class="flex gap-2 items-center"><span class="text-[#9dabb9]">BTC/USD</span> <span class="text-white"
                    id="ticker-btc-2">--</span> <span class="text-bull">+2.15%</span></div>
        </div>
    </div>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar Navigation -->
        <aside class="w-64 border-r border-border-dark bg-[#111418] flex flex-col shrink-0 hidden md:flex">
            <div class="flex-1 overflow-y-auto py-6 px-3 flex flex-col gap-1">
                <a href="dashboard.html"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-primary/10 text-primary font-medium">
                    <span class="material-symbols-outlined">dashboard</span>
                    <span>Dashboard</span>
                </a>
                <a href="comparison.html"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#9dabb9] hover:bg-[#283039] hover:text-white transition-colors">
                    <span class="material-symbols-outlined">compare_arrows</span>
                    <span>Comparar</span>
                </a>
                <a href="alerts.html"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#9dabb9] hover:bg-[#283039] hover:text-white transition-colors">
                    <span class="material-symbols-outlined">notifications</span>
                    <span>Alertas</span>
                </a>
                <a href="community.html"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#9dabb9] hover:bg-[#283039] hover:text-white transition-colors">
                    <span class="material-symbols-outlined">forum</span>
                    <span>Comunidad</span>
                </a>
                <a href="settings.html"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#9dabb9] hover:bg-[#283039] hover:text-white transition-colors">
                    <span class="material-symbols-outlined">settings</span>
                    <span>Configuración</span>
                </a>
            </div>

            <div class="p-4 border-t border-border-dark">
                <div class="flex items-center gap-3">
                    <div id="user-avatar"
                        class="size-8 rounded-full bg-surface-dark flex items-center justify-center text-primary font-bold">
                        U</div>
                    <div class="flex flex-col">
                        <span id="user-name" class="text-xs font-bold text-white">Cargando...</span>
                        <span id="user-plan" class="text-[10px] text-[#9dabb9]">...</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0 bg-[#0b0e11] overflow-hidden relative pb-16 md:pb-0">
            <!-- Asset Header -->
            <div
                class="h-16 border-b border-border-dark flex items-center justify-between px-4 md:px-6 bg-[#111418] shrink-0">
                <div class="flex items-center gap-4">
                    <div class="bg-white/10 rounded-md p-1.5">
                        <span class="material-symbols-outlined text-white">currency_bitcoin</span>
                    </div>
                    <div>
                        <h1 class="text-white text-lg font-bold leading-none" id="main-name">Bitcoin</h1>
                        <span class="text-[#9dabb9] text-xs font-medium" id="main-symbol">BTC/USD</span>
                    </div>
                    <div class="ml-4">
                        <span class="text-2xl font-bold text-white leading-none tracking-tight"
                            id="main-price">$0.00</span>
                    </div>
                </div>
            </div>

            <!-- TradingView Widget BEGIN -->
            <div class="flex-1 w-full relative" id="tv-chart-container" style="height: 100%; min-height: 500px;"></div>
            <!-- TradingView Widget END -->
        </main>

        <!-- Watchlist Sidebar -->
        <aside class="w-72 border-l border-border-dark bg-[#111418] flex flex-col shrink-0 hidden lg:flex">
            <div class="p-4 border-b border-border-dark flex items-center justify-between">
                <h3 class="text-white font-semibold text-sm">Watchlist</h3>
                <button onclick="toggleModal('add-asset-modal')"
                    class="text-[#9dabb9] hover:text-white transition-colors">
                    <span class="material-symbols-outlined text-xl">add_circle</span>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto" id="watchlist-container">
                <!-- Dynamic Items Injected Here -->
            </div>
        </aside>
    </div>

    <!-- Mobile Bottom Navigation -->


    <!-- Add Asset Modal -->
    <div id="add-asset-modal"
        class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm">
        <div class="bg-[#1c2127] border border-border-dark rounded-xl w-full max-w-md overflow-hidden shadow-2xl">
            <div class="p-4 border-b border-border-dark flex items-center justify-between">
                <h3 class="font-bold text-white">Agregar Activo</h3>
                <button onclick="toggleModal('add-asset-modal')" class="text-[#9dabb9] hover:text-white">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="p-4 border-b border-border-dark">
                <div class="flex items-center bg-[#111418] rounded-lg border border-border-dark px-3 py-2">
                    <span class="material-symbols-outlined text-[#9dabb9] text-sm">search</span>
                    <input type="text" id="modal-search-input" placeholder="Buscar (ej. SOL, NVDA)..."
                        class="bg-transparent border-none focus:ring-0 text-sm w-full text-white placeholder-[#9dabb9] ml-2">
                </div>
            </div>
            <div class="max-h-64 overflow-y-auto p-2" id="modal-search-results">
                <!-- Search Results -->
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 flex flex-col gap-3 z-50"></div>

    <!-- External Script for Widget -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>

    <script>
        // --- 0. TOAST NOTIFICATIONS ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            // Colors based on type
            let bg = 'bg-[#1c2127]';
            let border = 'border-border-dark';
            let icon = 'info';
            let iconColor = 'text-[#9dabb9]';

            if (type === 'success') {
                bg = 'bg-[#0f2e1b]'; // Dark green tint
                border = 'border-bull/30';
                icon = 'check_circle';
                iconColor = 'text-bull';
            } else if (type === 'error') {
                bg = 'bg-[#2e1212]'; // Dark red tint
                border = 'border-bear/30';
                icon = 'error';
                iconColor = 'text-bear';
            }

            toast.className = `flex items-center gap-3 px-4 py-3 rounded-lg border ${border} ${bg} text-white shadow-xl transform transition-all duration-300 translate-y-2 opacity-0 min-w-[300px]`;
            toast.innerHTML = `
                <span class="material-symbols-outlined ${iconColor}">${icon}</span>
                <span class="text-sm font-medium flex-1">${message}</span>
                <button onclick="this.parentElement.remove()" class="text-[#9dabb9] hover:text-white">
                    <span class="material-symbols-outlined text-sm">close</span>
                </button>
            `;

            container.appendChild(toast);

            // Animate in
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            // Auto dismiss
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        }

        // --- 1. CONFIGURATION ---
        const API_URL = ''; // Relative path for production
        const token = localStorage.getItem('access_token');
        if (!token) window.location.href = 'login.html';

        // --- 2. AUTH & PROFILE ---
        function logout() {
            localStorage.removeItem('access_token');
            window.location.href = 'login.html';
        }

        async function loadProfile() {
            try {
                const res = await fetch(`${API_URL}/auth/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error('Failed to load profile');
                const user = await res.json();

                // Update Sidebar
                const userName = user.name || user.email.split('@')[0];
                document.getElementById('user-name').innerText = userName;
                document.getElementById('user-plan').innerText = user.plan === 'FREE' ? 'Plan Gratuito' : 'Premium';

                // Update Avatar
                const initial = userName[0].toUpperCase();
                const avatarEl = document.getElementById('user-avatar');
                const mobileAvatarEl = document.getElementById('mobile-header-avatar');
                const mobileAvatarFallback = document.getElementById('mobile-avatar-fallback');

                // Function to set avatar style
                const setAvatar = (el, fallbackEl) => {
                    if (user.avatarUrl) {
                        if (fallbackEl) fallbackEl.style.display = 'none';
                        el.style.backgroundImage = `url('${API_URL}${user.avatarUrl}')`;
                        el.classList.remove('text-primary'); // Remove fallback color class if implied
                        if (!mobileAvatarEl) el.innerText = ''; // Clear text if it was a simpler container
                    } else {
                        if (fallbackEl) {
                            fallbackEl.style.display = 'flex';
                            fallbackEl.innerText = initial;
                        } else {
                            // Desktop sidebar avatar is a simple div
                            el.innerText = initial;
                            el.style.backgroundImage = 'none';
                            el.classList.add('text-primary');
                        }
                    }
                };

                // Set Desktop
                setAvatar(avatarEl);

                // Set Mobile
                if (user.avatarUrl) {
                    if (mobileAvatarFallback) mobileAvatarFallback.style.display = 'none';
                    mobileAvatarEl.style.backgroundImage = `url('${API_URL}${user.avatarUrl}')`;
                } else {
                    if (mobileAvatarFallback) {
                        mobileAvatarFallback.style.display = 'flex';
                        mobileAvatarFallback.innerText = initial;
                    }
                    mobileAvatarEl.style.backgroundImage = 'none';
                }


            } catch (error) {
                console.error('Profile Load Error:', error);
                document.getElementById('user-name').innerText = 'Usuario';
            }
        }

        // --- 3. MARKET DATA LOGIC ---
        const state = {
            currentSymbol: 'BTC',
            prices: {}
        };

        const assetMap = {
            'BTC': 'BINANCE:BTCUSDT',
            'ETH': 'BINANCE:ETHUSDT',
            'SPY': 'AMEX:SPY',
            'AAPL': 'NASDAQ:AAPL'
        };

        const detailsMap = {
            'BTC': { name: 'Bitcoin', sub: 'BTC/USD', type: 'Crypto' },
            'ETH': { name: 'Ethereum', sub: 'ETH/USD', type: 'Crypto' },
            'SPY': { name: 'S&P 500', sub: 'SPY', type: 'Stocks' },
            'AAPL': { name: 'Apple Inc', sub: 'AAPL', type: 'Stocks' }
        };

        // Fetch single price
        async function fetchPrice(symbol) {
            try {
                const res = await fetch(`${API_URL}/market/price/${symbol}`);
                if (!res.ok) return null;
                return await res.json(); // { symbol, price, change24h }
            } catch (e) {
                console.warn(`Price fetch failed for ${symbol}`, e);
                return null;
            }
        }

        // Update all visible prices (Marquee + Main)
        async function updateMarketData() {
            const symbols = ['BTC', 'ETH', 'SPY', 'AAPL', 'TSLA'];

            for (const sym of symbols) {
                const data = await fetchPrice(sym);
                if (data) {
                    state.prices[sym] = data;

                    // Update Marquee if element exists
                    const tickerEl = document.getElementById(`ticker-${sym.toLowerCase()}`);
                    if (tickerEl) {
                        tickerEl.innerText = parseFloat(data.price).toFixed(2);
                        // Update color if we had change data (mock doesn't always return change correctly formatted)
                        const change = parseFloat(data.change24h || 0);
                        const parent = tickerEl.parentElement;
                        const changeEl = parent.querySelector('span:last-child');
                        if (changeEl) {
                            changeEl.innerText = (change >= 0 ? '+' : '') + change + '%';
                            changeEl.className = change >= 0 ? 'text-bull' : 'text-bear';
                        }
                    }

                    // Update Main Price if selected
                    if (sym === state.currentSymbol) {
                        updateMainPriceDisplay(data);
                    }
                }
            }
        }

        function updateMainPriceDisplay(data) {
            const priceEl = document.getElementById('main-price');
            priceEl.innerText = '$' + parseFloat(data.price).toLocaleString('en-US', { minimumFractionDigits: 2 });

            // Should add a color flash effect here ideally
            priceEl.style.color = 'white';
            setTimeout(() => { priceEl.style.color = ''; }, 200);
        }

        // --- 4. TRADINGVIEW & SELECTION ---
        let tvWidget;
        function initWidget(symbolKey) {
            const tvSymbol = assetMap[symbolKey] || 'BINANCE:BTCUSDT';
            document.getElementById('tv-chart-container').innerHTML = '';
            tvWidget = new TradingView.widget({
                "autosize": true,
                "symbol": tvSymbol,
                "interval": "D",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "enable_publishing": false,
                "allow_symbol_change": true,
                "container_id": "tv-chart-container",
                "hide_side_toolbar": false
            });
        }

        window.selectAsset = async function (symbol) {
            state.currentSymbol = symbol;
            console.log("Switching to:", symbol);

            // Update Header Info
            const info = detailsMap[symbol];
            if (info) {
                document.getElementById('main-name').innerText = info.name;
                document.getElementById('main-symbol').innerText = info.sub;
            }

            // Fetch latest price immediately
            const data = await fetchPrice(symbol);
            if (data) updateMainPriceDisplay(data);

            // Update Widget
            initWidget(symbol);
        }

        // --- 5. SEARCH LOGIC & MODAL ---
        // --- 5. SEARCH LOGIC & MODAL ---
        let searchDebounceTimeout;

        function toggleModal(id) {
            const el = document.getElementById(id);
            if (el) {
                if (el.classList.contains('hidden')) {
                    el.classList.remove('hidden');
                    // Focus input
                    setTimeout(() => document.getElementById('modal-search-input').focus(), 100);
                } else {
                    el.classList.add('hidden');
                }
            }
        }

        async function searchAssets(term) {
            if (!term || term.length < 2) {
                document.getElementById('modal-search-results').innerHTML = '';
                return;
            }

            try {
                const res = await fetch(`${API_URL}/market/search?q=${term}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const results = await res.json();
                    renderSearchResults(results);
                }
            } catch (e) {
                console.error("Search error", e);
            }
        }

        function renderSearchResults(results) {
            const container = document.getElementById('modal-search-results');
            container.innerHTML = '';

            results.forEach(asset => {
                const item = document.createElement('div');
                item.className = "flex items-center justify-between p-3 hover:bg-[#283039] rounded-lg cursor-pointer transition-colors mb-1";
                item.onclick = () => addToWatchlist(asset);

                let icon = 'attach_money';
                if (asset.type === 'Crypto') icon = 'currency_bitcoin';
                if (asset.type === 'Stocks') icon = 'show_chart';

                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="size-8 rounded bg-primary/10 flex items-center justify-center text-primary font-bold text-[10px]">${asset.symbol}</div>
                        <div>
                            <div class="text-white font-medium text-sm">${asset.name}</div>
                            <div class="flex gap-2 text-[#9dabb9] text-xs">
                                <span>${asset.type}</span>
                                <span>•</span>
                                <span>${asset.exchange}</span>
                            </div>
                        </div>
                    </div>
                    <span class="material-symbols-outlined text-[#9dabb9] hover:text-white">add_circle</span>
                `;
                container.appendChild(item);
            });
        }

        document.getElementById('modal-search-input').addEventListener('input', (e) => {
            const term = e.target.value;
            clearTimeout(searchDebounceTimeout);
            searchDebounceTimeout = setTimeout(() => searchAssets(term), 500); // 500ms debounce
        });

        // --- 6. WATCHLIST API ---
        async function loadWatchlist() {
            try {
                const res = await fetch(`${API_URL}/watchlist`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error('Failed to load watchlist');
                const assets = await res.json();
                renderWatchlist(assets);
            } catch (error) {
                console.error("Watchlist Load Error:", error);
            }
        }

        function renderWatchlist(assets) {
            const container = document.getElementById('watchlist-container');
            container.innerHTML = '';

            assets.forEach(asset => {
                const item = document.createElement('div');
                item.className = "flex items-center justify-between px-4 py-3 hover:bg-[#1c2127] cursor-pointer border-b border-border-dark/50 transition-colors group";
                item.onclick = (e) => {
                    // Prevent switching if clicking delete button (if we add one later, for now just click)
                    selectAsset(asset.symbol);
                };

                // Color logic
                let colorClass = 'text-primary bg-primary/10';
                if (asset.symbol === 'BTC') colorClass = 'text-orange-500 bg-orange-500/10';
                if (asset.symbol === 'ETH') colorClass = 'text-purple-500 bg-purple-500/10';
                if (asset.symbol === 'SPY') colorClass = 'text-green-500 bg-green-500/10';

                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="size-8 rounded ${colorClass} flex items-center justify-center font-bold text-[10px]">${asset.symbol}</div>
                        <div class="flex flex-col">
                            <span class="text-white text-sm font-medium">${asset.name}</span>
                            <span class="text-[#9dabb9] text-xs">${asset.type}</span>
                        </div>
                    </div>
                `;

                // Add Delete Button (visible on hover)
                const deleteBtn = document.createElement('button');
                deleteBtn.className = "text-[#9dabb9] hover:text-bear opacity-0 group-hover:opacity-100 transition-opacity p-2";
                deleteBtn.innerHTML = '<span class="material-symbols-outlined text-sm">delete</span>';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    removeFromWatchlist(asset.symbol);
                };

                item.appendChild(deleteBtn);
                container.appendChild(item);
            });

            // Also update global asset map/details map dynamically if needed for the chart
            assets.forEach(a => {
                if (!detailsMap[a.symbol]) {
                    detailsMap[a.symbol] = { name: a.name, sub: a.symbol, type: a.type };
                    // Default generic map
                    assetMap[a.symbol] = (a.type === 'Crypto' ? `BINANCE:${a.symbol}USDT` : `NASDAQ:${a.symbol}`);
                }
            });
        }

        async function addToWatchlist(asset) {
            try {
                const res = await fetch(`${API_URL}/watchlist/${asset.symbol}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ type: asset.type, name: asset.name })
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.message || res.statusText);
                }

                toggleModal('add-asset-modal');
                showToast(`Activo ${asset.symbol} agregado correctamente`, 'success');
                loadWatchlist();
            } catch (e) {
                console.error("Add failed", e);
                showToast(e.message || 'Error al agregar activo', 'error');
            }
        }

        async function removeFromWatchlist(symbol) {
            if (!confirm('¿Eliminar de watchlist?')) return;
            // Ideally convert confirm to a custom modal too, but step by step.
            try {
                const res = await fetch(`${API_URL}/watchlist/${symbol}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error('Error al eliminar');
                showToast(`${symbol} eliminado`, 'info');
                loadWatchlist();
            } catch (e) {
                console.error("Remove failed", e);
                showToast('Error al eliminar activo', 'error');
            }
        }

        // --- 6. INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            loadProfile();
            loadWatchlist();
            selectAsset('BTC'); // Default load

            // Initial Market Data Load
            updateMarketData();

            // Polling for prices every 10 seconds
            setInterval(updateMarketData, 10000);
        });

    </script>
</body>

</html>
